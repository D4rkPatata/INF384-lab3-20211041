name: app

# Pipeline de aplicacion. Es dueno de la imagen que ejecuta la funcion y no
# toca la infraestructura.
#
# De las cuatro gates, solo `secretos` detiene el pipeline. Las otras
# tres informan y dejan pasar: el hallazgo tiene que quedar visible en la
# ejecucion, no enterrado en el log.
#
# El repositorio no tiene archivo de excepciones. Un hallazgo que se decida
# no corregir se anota donde se produce: junto a la linea de codigo que lo
# origina, o en el paso del pipeline que lo detecta cuando el hallazgo no
# corresponde a ninguna linea. La anotacion lleva identificador del hallazgo,
# razon, responsable y fecha de vencimiento. Las cuatro, siempre.
#
# En los jobs sin implementar, preferir una action del marketplace o la
# imagen oficial de la herramienta antes que instalarla paso a paso en el
# runner. La guia del laboratorio lista las referencias disponibles.

on:
  push:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  workflow_dispatch:

jobs:

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar desde el lock file
        run: npm ci

      - name: Pruebas con reporte de cobertura
        run: npm run test:coverage

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: error

  # TODO
  # Publicar el analisis de calidad y la cobertura en SonarQube Cloud, como
  # en el Laboratorio 2.
  #
  # La configuracion del analisis viene resuelta en sonar-project.properties
  # y no hay que editarla. Lo que falta es el ensamblaje: las credenciales,
  # la cobertura y el analisis del historial.
  #
  # El reporte de cobertura lo produce el job pruebas.
  # El analisis necesita el historial completo del repositorio para saber
  # que es codigo nuevo.
  #
  # Esta compuerta no detiene el pipeline: el resultado queda en SonarQube
  # Cloud y se lee ahi.
  #
  # Sustituir el paso centinela por la implementacion.
  calidad:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: sin esto Sonar no puede distinguir codigo
          # nuevo de codigo existente (New Code definition).
          fetch-depth: 0
 
      - name: Descargar el reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage/
 
      - name: Analisis de SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SonarCloud (no self-hosted): host fijo, no requiere secreto propio.
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  # TODO
  # Buscar credenciales escritas en el codigo y en el historial del repositorio.
  # El alcance incluye el historial completo, no solo el ultimo commit.
  #
  # Condicion de detencion: cualquier hallazgo. Esta es la unica compuerta
  # de este pipeline que detiene.
  #
  # Una credencial no se exceptua. Se retira del codigo, se retira del
  # historial y se rota en el origen. Silenciar el hallazgo deja la credencial
  # viva y ademas apaga el control para la proxima.
  #
  # Sustituir el paso centinela por la implementacion.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Buscar credenciales con gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # TODO
  # Contrastar el arbol de dependencias declarado en package-lock.json contra
  # vulnerabilidades conocidas.
  #
  # El alcance es el arbol completo, no solo las dependencias de produccion.
  # El repositorio arrastra un hallazgo que solo aparece si el alcance es el
  # correcto: si el informe trae uno solo, el alcance esta mal.
  #
  # Esta compuerta no detiene el pipeline. El hallazgo no cuelga de ninguna
  # linea de codigo: la anotacion, si se decide no corregir, va en el paso
  # que lo detecta.
  #
  # Sustituir el paso centinela por la implementacion.
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Analizar package-lock.json con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          format: json
          output: trivy-report.json
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
 
      - name: Publicar hallazgos sin abrir el log
        if: always()
        run: |
          total="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)"
 
          {
            echo '### dependencias — Trivy (package-lock.json, arbol completo)'
            echo
            if [ "$total" -gt 0 ]; then
              echo "Se encontraron **$total** vulnerabilidades conocidas."
              echo
              echo '| Paquete | Version | Vulnerabilidad | Severidad |'
              echo '|---|---|---|---|'
              jq -r '.Results[]?.Vulnerabilities[]? |
                "| \(.PkgName) | \(.InstalledVersion) | \(.VulnerabilityID) | \(.Severity) |"' \
                trivy-report.json
            else
              echo 'No se encontraron vulnerabilidades conocidas.'
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
 
          if [ "$total" -gt 0 ]; then
            echo "::warning::dependencias: $total vulnerabilidades conocidas en package-lock.json (no bloqueante, ver resumen)."
          fi

  # TODO
  # Buscar patrones explotables en el codigo fuente.
  #
  # Esta compuerta no detiene el pipeline. El hallazgo cuelga de una linea
  # concreta: la anotacion, si se decide no corregir, va junto a esa linea.
  #
  # Sustituir el paso centinela por la implementacion.
  estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Analizar el codigo fuente
        continue-on-error: true
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            semgrep/semgrep \
            semgrep scan \
            --config=p/default \
            --config=p/javascript \
            --json --quiet \
            --output=semgrep.json \
            src/
 
      - name: Publicar hallazgos sin abrir el log
        if: always()
        run: |
          total="$(jq '.results | length' semgrep.json)"
 
          {
            echo '### estatico — Semgrep'
            echo
            if [ "$total" -gt 0 ]; then
              echo "Se encontraron **$total** hallazgos en el codigo fuente."
              echo
              echo '| Archivo | Linea | Regla |'
              echo '|---|---|---|'
              jq -r '.results[] | "| \(.path) | \(.start.line) | \(.check_id) |"' semgrep.json
            else
              echo 'No se encontraron patrones explotables conocidos.'
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
 
      - name: Anotar cada hallazgo junto a su linea
        if: always()
        run: |
          jq -c '.results[]' semgrep.json | while read -r hallazgo; do
            archivo="$(echo "$hallazgo" | jq -r '.path')"
            linea="$(echo "$hallazgo" | jq -r '.start.line')"
            regla="$(echo "$hallazgo" | jq -r '.check_id')"
            mensaje="$(echo "$hallazgo" | jq -r '.extra.message' | tr '\n' ' ' | cut -c1-200)"
            echo "::warning file=${archivo},line=${linea}::[${regla}] ${mensaje}"
          done

  # TODO
  # Construir la imagen de la aplicacion y publicarla en el registro privado.
  #
  # Depende de los cuatro jobs anteriores y corre solo desde la rama principal.
  #
  # La imagen se publica con tres tags independientes sobre el mismo manifiesto:
  # el sha corto del commit, la version y el ambiente.
  #
  #   - El sha es el tag con el que se publica. Nace del commit, siempre
  #     existe y no se reasigna nunca.
  #   - La version identifica el artefacto para las personas y tampoco se
  #     reasigna.
  #   - El de ambiente se reasigna en cada publicacion y siempre apunta a lo
  #     ultimo publicado para ese ambiente.
  #
  # Los dos ultimos se apuntan al manifiesto ya publicado. Agregar un tag a
  # una imagen publicada no reenvia capas.
  #
  # La construccion es para linux/amd64 y declara el label
  # org.opencontainers.image.title con el nombre de la aplicacion.
  #
  # Condicion de detencion: cualquier fallo de construccion o de publicacion.
  #
  # El job desplegar consume la salida 'digest' de este job. El formato es
  # <registro>/<aplicacion>@sha256:... Exponer solo el sha del digest, o
  # nombrar la salida de otra manera, rompe el despliegue.
  #
  # outputs:
  #   digest: # TODO
  #
  # Sustituir el paso centinela por la implementacion.
  publicar:
    # Depende de las cuatro gates. Solo `secretos` puede fallar y cortar aqui;
    # las otras tres terminan en verde aunque tengan hallazgos.
    needs: [calidad, secretos, dependencias, estatico]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_NAME: inf384-lab3   # <-- confirmar que es el nombre del repo ECR (ver setup-infra.yml)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login al registro privado (ECR)
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calcular tags
        id: tags
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Construir la imagen (linux/amd64)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.APP_NAME }}
          SHA: ${{ steps.tags.outputs.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            --label org.opencontainers.image.title="${APP_NAME}" \
            --tag "${IMAGE}:${SHA}" \
            .

      - name: Publicar con el tag del sha y leer el digest
        id: push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.APP_NAME }}
          SHA: ${{ steps.tags.outputs.sha }}
        run: |
          docker push "${IMAGE}:${SHA}"
          # Formato: <registro>/<aplicacion>@sha256:...
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${SHA}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "### publicar" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Apuntar version y prd al mismo manifiesto (sin reenviar capas)
        env:
          SHA: ${{ steps.tags.outputs.sha }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          manifest="$(aws ecr batch-get-image --repository-name "$APP_NAME" \
            --image-ids imageTag="$SHA" --query 'images[0].imageManifest' --output text)"
          media="$(aws ecr batch-get-image --repository-name "$APP_NAME" \
            --image-ids imageTag="$SHA" --query 'images[0].imageManifestMediaType' --output text)"
          digest_sha="$(aws ecr describe-images --repository-name "$APP_NAME" \
            --image-ids imageTag="$SHA" --query 'imageDetails[0].imageDigest' --output text)"

          poner_tag() {
            out="$(aws ecr put-image --repository-name "$APP_NAME" --image-tag "$1" \
              --image-manifest "$manifest" --image-manifest-media-type "$media" 2>&1)" \
            || { echo "$out" | grep -q ImageAlreadyExistsException || { echo "$out"; exit 1; }; }
          }

          # version: no se reasigna. Si ya existe apuntando a otro digest, no se toca.
          actual="$(aws ecr describe-images --repository-name "$APP_NAME" \
            --image-ids imageTag="$VERSION" --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          if [ -n "$actual" ] && [ "$actual" != "None" ] && [ "$actual" != "$digest_sha" ]; then
            echo "::warning::El tag $VERSION ya apunta a otro manifiesto; no se reasigna. Sube la version en package.json."
          else
            poner_tag "$VERSION"
          fi

          # prd: movil, siempre apunta a lo ultimo publicado
          poner_tag prd

  # Este job viene completo y no se modifica.
  # Las estrategias de despliegue y la verificacion posterior son contenido
  # de la sesion 6. La pregunta de reflexion 2 pide leerlo.
  desplegar:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Actualizar la funcion por digest
        run: |
          aws lambda update-function-code \
            --function-name inf384-lab3 \
            --image-uri ${{ needs.publicar.outputs.digest }}

      - name: Esperar a que la actualizacion termine
        run: aws lambda wait function-updated --function-name inf384-lab3
